; ==========================================================
; PlatformIO configuration for ROS2 Robot / Arduino Firmware
; Supports:
;   - Laptop (USB → ttyUSB0/ACM0/COM*)
;   - Jetson Orin Nano (CH341 → ttyCH341USB0)
; ==========================================================

[platformio]
default_envs = auto_detect

; ----------------------------------------------------------
; Automatic environment (tries to upload to any serial port)
; ----------------------------------------------------------
[env:auto_detect]
platform = atmelavr
board = uno
framework = arduino

; Try all typical ports. PlatformIO will choose the correct one.
upload_port = auto
monitor_port = auto
upload_speed = 115200
monitor_speed = 115200

; ----------------------------------------------------------
; Environment specifically for Jetson + CH341 clones
; (Used only if auto-detect ever fails)
; ----------------------------------------------------------
[env:jetson_ch341]
platform = atmelavr
board = uno
framework = arduino

upload_port = /dev/ttyCH341USB0
monitor_port = /dev/ttyCH341USB0
upload_speed = 115200
monitor_speed = 115200

; If auto-detect fails, manually specify the environment:
; pio run -e jetson_ch341 -t upload
